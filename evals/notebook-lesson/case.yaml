schema_version: '1.1'
name: 'notebook-lesson'
description: 'Explain a notebook as a lesson: read it with read_notebook, chapters with real numbers, checks and a review, no warning left.'
runs: 3
execution:
  max_turns: 100
  timeout_seconds: 3600
  allowed_tools:
    - 'Read'
    - 'Glob'
    - 'Grep'
    - 'Skill'
    - 'mcp__plugin_explicador_explicador__ensure_index'
    - 'mcp__plugin_explicador_explicador__show_scene'
    - 'mcp__plugin_explicador_explicador__render_scene'
    - 'mcp__plugin_explicador_explicador__answer_question'
    - 'mcp__plugin_explicador_explicador__explain_code'
    - 'mcp__plugin_explicador_explicador__read_notebook'
    - 'mcp__plugin_explicador_explicador__export_scene'
    - 'mcp__plugin_explicador_explicador__add_finding'
  env:
    EVAL_EXPLICADOR_NO_BROWSER: '1'
  prompt: 'Quiero entender el notebook reviews.ipynb: explícamelo como una lección para alguien que empieza. Usa «reviews» como tema.'
context:
  scaffold_script: 'scaffold.sh'
graders:
  - name: 'rule-skill'
    type: 'tool_used'
    tool: 'Skill'
    weight: 1
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?explicador(?::explain)?"'
    min: 1
  - name: 'rule-read-notebook'
    type: 'tool_used'
    tool: 'mcp__plugin_explicador_explicador__read_notebook'
    weight: 2
    min: 1
  - name: 'rule-no-raw-notebook'
    type: 'tool_used'
    tool: 'Read'
    weight: 2
    input_match: '\.ipynb'
    max: 0
    min: 0
  - name: 'rule-rendered'
    type: 'file_exists'
    path: '.explicador/scenes/reviews.json'
    weight: 2
  - name: 'rule-no-warnings'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '"warnings"'
    weight: 3
    match: 'not_contains'
  - name: 'uses-stats'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '<stats\b'
    weight: 1
  - name: 'uses-map'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '<journey\b'
    weight: 1
  - name: 'chapters-per-section'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '(?:<chapter\b[\s\S]*?){6}'
    weight: 1
  - name: 'concepts-from-zero'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '(?:<concept\b[\s\S]*?){4}'
    weight: 1
  - name: 'concepts-with-analogy'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '(?:<analogy>[\s\S]*?){4}'
    weight: 1
  - name: 'uses-trace'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '<trace\b'
    weight: 1
  - name: 'uses-confusion'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: 'kind=.{0,2}confusion'
    weight: 1
  - name: 'uses-calc'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '<calc\b'
    weight: 1
  - name: 'uses-threshold'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '<threshold\b'
    weight: 1
  - name: 'review-flashcards'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '(?:<answer>[\s\S]*?){5}'
    weight: 1
  - name: 'fact-accuracy'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '0[.,]833'
    weight: 1
  - name: 'rule-spanish'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '\b(?:reseñas?|modelo|palabras?)\b'
    weight: 1
    flags: 'i'
  - name: 'rule-no-english'
    type: 'regex'
    target:
      source: 'file'
      path: '.explicador/scenes/reviews.json'
    pattern: '\b(?:which|because|should)\b'
    weight: 1
    match: 'not_contains'
    flags: 'i'
  - name: 'rule-reply-url'
    type: 'regex'
    target: 'last_message'
    pattern: 'http://127\.0\.0\.1:\d+/\?t=[a-f0-9]+'
    weight: 1
  - name: 'reply-short'
    type: 'regex'
    target: 'last_message'
    pattern: '[\s\S]{1500}'
    weight: 1
    match: 'not_contains'
  - name: 'reply-no-code'
    type: 'regex'
    target: 'last_message'
    pattern: '```'
    weight: 1
    match: 'not_contains'
  - name: 'rule-reply-spanish'
    type: 'regex'
    target: 'last_message'
    pattern: '\b(?:lección|reseñas?|modelo)\b'
    weight: 1
    flags: 'i'
