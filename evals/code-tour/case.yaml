schema_version: '1.1'
name: 'code-tour'
description: '"Walk me through the code" becomes an explain_code tour that follows the code across files.'
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools:
    - 'Read'
    - 'Glob'
    - 'Grep'
    - 'Skill'
    - 'mcp__plugin_explicador_explicador__ensure_index'
    - 'mcp__plugin_explicador_explicador__show_scene'
    - 'mcp__plugin_explicador_explicador__render_scene'
    - 'mcp__plugin_explicador_explicador__answer_question'
    - 'mcp__plugin_explicador_explicador__explain_code'
    - 'mcp__plugin_explicador_explicador__read_notebook'
    - 'mcp__plugin_explicador_explicador__export_scene'
    - 'mcp__plugin_explicador_explicador__add_finding'
  env:
    EVAL_EXPLICADOR_NO_BROWSER: '1'
  prompt: 'Enséñame paso a paso el código que comprueba la contraseña cuando alguien inicia sesión.'
context:
  scaffold_script: 'scaffold.sh'
graders:
  - name: 'rule-skill'
    type: 'tool_used'
    tool: 'Skill'
    weight: 1
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?explicador(?::explain)?"'
    min: 1
  - name: 'rule-tour'
    type: 'tool_used'
    tool: 'mcp__plugin_explicador_explicador__explain_code'
    weight: 3
    min: 1
  - name: 'rule-tour-ranges'
    type: 'tool_used'
    tool: 'mcp__plugin_explicador_explicador__explain_code'
    weight: 2
    input_match: 'password\.js:\d+-\d+'
    min: 1
  - name: 'follows-the-flow'
    type: 'tool_used'
    tool: 'mcp__plugin_explicador_explicador__explain_code'
    weight: 1
    input_match: 'auth-service\.js:\d+'
    min: 1
  - name: 'tour-steps'
    type: 'tool_used'
    tool: 'mcp__plugin_explicador_explicador__explain_code'
    weight: 1
    input_match: '(?:"ref"[\s\S]*?){3}'
    min: 1
  - name: 'tour-timing-safe'
    type: 'tool_used'
    tool: 'mcp__plugin_explicador_explicador__explain_code'
    weight: 1
    input_match: 'timingSafeEqual'
    min: 1
  - name: 'tour-dummy-hash'
    type: 'tool_used'
    tool: 'mcp__plugin_explicador_explicador__explain_code'
    weight: 1
    input_match: 'DUMMY_HASH|dummy|hash falso|ficticio|señuelo|relleno'
    min: 1
  - name: 'rule-tour-spanish'
    type: 'tool_used'
    tool: 'mcp__plugin_explicador_explicador__explain_code'
    weight: 1
    input_match: '\b(?:contraseña|clave|usuario)\b'
    min: 1
  - name: 'reply-short'
    type: 'regex'
    target: 'last_message'
    pattern: '[\s\S]{1200}'
    weight: 1
    match: 'not_contains'
  - name: 'reply-no-code'
    type: 'regex'
    target: 'last_message'
    pattern: '```'
    weight: 1
    match: 'not_contains'
